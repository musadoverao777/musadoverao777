name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:       # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # cinza neutro nos vazios (funciona em claro e escuro) + roxo nos commits/cobra
          outputs: |
            dist/github-snake.svg?color_snake=#7F77DD&color_dots=#8b8b9e,#b3a9f0,#9388e8,#7F77DD,#6055c0

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
